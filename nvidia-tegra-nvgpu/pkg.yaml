name: nvidia-tegra-nvgpu
variant: scratch
shell: /bin/bash
dependencies:
  - stage: base
  - stage: kernel-build
  - image: "{{ .LLVM_IMAGE }}:{{ .TOOLS_REV }}"
steps:
  - sources:
      # OE4T patched nvgpu - supports kernel 6.x (fixes platform_driver.remove, hrtimer, struct fd)
      - url: https://github.com/OE4T/linux-nvgpu/archive/d530a48d64f9ad3020d9f3307f53e8dde8e3fba1.tar.gz
        destination: nvgpu.tar.gz
        sha256: "adc5864edf76d986866e386803a9e628ee229e69ea34867b92b978a0b44f3d54"
        sha512: "a7c7f0b5d3174bf41abc77c77009f46182358f93936aedbe4993e63ff7fc94e21bfd83c3fa0b41af5836866b9c200427504d8f26685d567c11722e7a7bfd3ed9"
      # OE4T patched nvidia-oot - patches-r36.5 branch (stable; kernel 6.18 compat: __assign_str,
      # f_count->f_ref, __alloc_pages_bulk 5-arg, and all earlier 6.x fixes)
      - url: https://github.com/OE4T/linux-nv-oot/archive/ea32e7f97dd04c3f75aadc22424dc63568387120.tar.gz
        destination: nvidia-oot.tar.gz
        sha256: "9d2d70a121a418be307e3d1cd3c74d9ae9398e7abc756304d614e998dfd6f342"
        sha512: "5645163e964bfb13d7aa2ee1749188fe40a1fe9012080f548548f7dc70e4397a762c161041d8d209d2cd969cbb4aab36ea5c560ef5967946eeb3f1dd16335b9c"
      # OE4T patched hwpm - supports kernel 6.x (fixes platform_driver.remove, MODULE_IMPORT_NS)
      - url: https://github.com/OE4T/linux-hwpm/archive/4d8a6998760d85f98637dbf61597bfbb88158206.tar.gz
        destination: hwpm.tar.gz
        sha256: "96c7656bdad0bf330e7fd58981b8a4eec4717a76840cefbe84e720d88b46be55"
        sha512: "971b91fcae284c59dbe411356109bce9b1a7884b8fac41c9683c79bf3eddef606e71ebaa9c06ad2389b2ba382c3c1125fabe0cbaeb5edac857e218077ed24ef9"
    env:
      ARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      # conftest compiles its probes with $CC (default: cc = GCC). Against a
      # Clang-built kernel those probes fail wholesale and every NV_* macro stays
      # undefined. The kernel build itself ignores CC when LLVM=1.
      CC: clang
      # The OE4T top-level Makefiles add these include paths for every module; the
      # module directories are built individually here, so pass them globally.
      KCFLAGS: >-
        -I/oot-src/out/nvidia-conftest
        -I/oot-src/nvidia-oot/include
        -I/oot-src/nvidia-oot/drivers/gpu/host1x/include
        -I/oot-src/nvidia-oot/drivers/video/tegra/nvmap/include
    prepare:
      - |
        for t in nvgpu nvidia-oot hwpm; do
          mkdir -p /oot-src/$t
          tar xzf $t.tar.gz -C /oot-src/$t --strip-components=1
        done
        # patches/<tree>/*.patch applies to /oot-src/<tree>
        for p in /pkg/patches/*/*.patch; do t=${p%/*}; patch -p1 -d /oot-src/${t##*/} < $p; done
    build:
      - |
        # conftest probes the kernel API and writes conftest/*.h, which selects the
        # code paths in every module (see CC above). Its Makefile hardcodes -Werror,
        # which turns Clang-only warnings into failed probes: 26 of 129 macros go
        # missing (measured), e.g. NV___ASSIGN_STR_HAS_NO_SRC_ARG, and one inverted
        # "function present" probe reports the wrong answer.
        CONFTEST=/oot-src/out/nvidia-conftest/nvidia
        mkdir -p $CONFTEST
        cp -a /oot-src/nvidia-oot/scripts/conftest/. $CONFTEST/
        sed -i 's/ -Werror / /' $CONFTEST/Makefile
        make -j$(nproc) -f $CONFTEST/Makefile src=$CONFTEST obj=$CONFTEST \
          NV_KERNEL_SOURCES=/src NV_KERNEL_OUTPUT=/src
        # a probe every 6.3+ kernel must pass: fails the build if conftest itself is broken
        grep -rq '#define NV_IOMMU_MAP_HAS_GFP_ARG' $CONFTEST/conftest/
      - |
        OOT=/oot-src/nvidia-oot
        SYMS=/oot-src/out/Module.symvers.nvidia
        : > $SYMS

        # Build one out-of-tree module directory against the Talos kernel and add its
        # exported symbols for the modules that follow (order matters). -Werror is
        # dropped from all Makefiles because Clang warns where GCC does not.
        oot() {
          make -j$(nproc) -C /src M=$1 "${@:2}" modules \
            CONFIG_TEGRA_OOT_MODULE=m ccflags-remove-y=-Werror \
            srctree.nvidia-oot=$OOT srctree.nvidia=$OOT srctree.nvconftest=/oot-src/out/nvidia-conftest \
            srctree.hwpm=/oot-src/hwpm KBUILD_EXTRA_SYMBOLS=$SYMS
          cat $1/Module.symvers >> $SYMS
        }

        oot $OOT/drivers/gpu/host1x
        oot $OOT/drivers/platform/tegra/mc-utils
        oot $OOT/drivers/gpu/host1x-fence
        oot $OOT/drivers/gpu/host1x-nvhost
        oot /oot-src/hwpm/drivers/tegra/hwpm
        # headless: no fbdev (the kernel config has it enabled, so it must be forced off)
        oot $OOT/drivers/gpu/drm/tegra CONFIG_DRM_FBDEV_EMULATION=n
        # the OE4T defaults for 5.10+ are handle-as-id and NvSciIpc support, neither is wanted here
        oot $OOT/drivers/video/tegra/nvmap NVMAP_CONFIG_HANDLE_AS_ID=n NVMAP_CONFIG_SCIIPC=n
        oot $OOT/drivers/devfreq
        # syncpoints through the OE4T host1x (the kernel has neither GRHOST nor HOST1X_NEXT)
        oot /oot-src/nvgpu/drivers/gpu/nvgpu CONFIG_TEGRA_GK20A_NVHOST=y CONFIG_TEGRA_GK20A_NVHOST_HOST1X=y
    install:
      - |
        OOT=/oot-src/nvidia-oot
        MOD=/rootfs/usr/lib/modules/$(cat /src/include/config/kernel.release)

        install -D -m 644 -t $MOD/extra/nvidia-tegra $(find /oot-src -name '*.ko')
        # Shadow the in-tree host1x and tegra-drm. They are built against the vanilla
        # host1x ABI; depmod would otherwise point modprobe at them and tegra_drm
        # fails with "disagrees about version of symbol host1x_job_alloc".
        install -D -m 644 -t $MOD/kernel/drivers/gpu/host1x    $OOT/drivers/gpu/host1x/host1x.ko
        install -D -m 644 -t $MOD/kernel/drivers/gpu/drm/tegra $OOT/drivers/gpu/drm/tegra/tegra-drm.ko

        # Sign with the same fixed key the kernel was built with (setup-keys.sh copies
        # it into the package directory). A key mismatch leaves every module unloadable.
        cp /pkg/signing_key.pem /pkg/signing_key.x509 /src/certs/
        find $MOD -name '*.ko' -exec /src/scripts/sign-file sha512 \
          /src/certs/signing_key.pem /src/certs/signing_key.x509 {} \;

        # Load order: tegra-drm needs the OE4T host1x stack; nvgpu needs all of it.
        mkdir -p /rootfs/usr/lib/modprobe.d
        printf 'softdep tegra-drm pre: host1x host1x-fence host1x-nvhost\n' \
          > /rootfs/usr/lib/modprobe.d/nvidia-tegra.conf
        printf 'softdep nvgpu pre: host1x nvmap host1x-fence host1x-nvhost tegra-drm mc-utils\n' \
          >> /rootfs/usr/lib/modprobe.d/nvidia-tegra.conf

        # build-extensions.sh takes the kernel image and signing cert from here to
        # assemble custom-installer without exporting the whole kernel-build stage.
        install -D -m 644 -t /rootfs/kernel /src/arch/arm64/boot/vmlinuz.efi /src/certs/talos_signing_key.x509
finalize:
  - from: /rootfs
    to: /rootfs
